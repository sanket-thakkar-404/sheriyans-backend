<!-- public/404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }

    h1 {
      font-size: 8rem;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 28px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s ease;
    }

    a:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🚫</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      The page you are looking for does not exist or has been moved.
    </p>
    <a href="/">Go Back Home</a>
  </div>
</body>
</html>
